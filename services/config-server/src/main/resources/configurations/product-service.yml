server:
  port: 8070

spring:
  datasource:
    url: jdbc:mysql://${PRODUCT_DB_HOST:localhost}:${PRODUCT_DB_PORT:3306}/productdb?allowPublicKeyRetrieval=true&useSSL=false
    username: ${PRODUCT_DB_USER:root}
    password: ${PRODUCT_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect